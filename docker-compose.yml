# Lingkungan lokal. Service app ditambahkan di M5 setelah Dockerfile siap.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: aiwriter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d aiwriter"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
